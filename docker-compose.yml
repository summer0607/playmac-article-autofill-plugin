services:
  runtime:
    image: ghcr.io/summer0607/playmac-article-autofill-runtime:latest
    container_name: playmac-article-autofill-runtime
    restart: unless-stopped
    init: true
    ipc: host
    ports:
      - "127.0.0.1:18990:8080"
    environment:
      PLAYMAC_RUNTIME_TOKEN: "${PLAYMAC_RUNTIME_TOKEN:-}"
    volumes:
      - playmac_article_runtime_data:/data

volumes:
  playmac_article_runtime_data:
